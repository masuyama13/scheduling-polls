<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- ブランドカラー #14b8a6 を基調とした美しい背景グラデーション -->
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <!-- 円形の背景 -->
  <circle cx="256" cy="256" r="256" fill="url(#brandBg)" />

  <!-- CとTの文字を繋いだモチーフ（白） -->
  <g fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <!-- CからTの上部へ繋がる連続ライン -->
    <!-- Cの下側カーブからスタートし、左・上へと回り込んでTの右上まで一筆書きで接続 -->
    <path d="M 230 350 A 100 100 0 1 1 230 160 C 270 160 300 160 390 160" />

    <!-- Tの縦棒（上の水平ラインから下へ伸びる） -->
    <path d="M 320 160 L 320 350" />
  </g>
</svg>
