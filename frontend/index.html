<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>%SERVICE_NAME% | Schedule across time zones</title>
    <meta name="description" content="Find a time that works for everyone across time zones with %SERVICE_NAME%." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SERVICE_NAME%" />
    <meta property="og:title" content="%SERVICE_NAME% | Schedule across time zones" />
    <meta
      property="og:description"
      content="Find a time that works for everyone across time zones with %SERVICE_NAME%."
    />
    <meta property="og:url" content="https://crosstimely.com/" />
    <meta property="og:image" content="https://crosstimely.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="CrossTimely — schedule across time zones." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SERVICE_NAME% | Schedule across time zones" />
    <meta
      name="twitter:description"
      content="Find a time that works for everyone across time zones with %SERVICE_NAME%."
    />
    <meta name="twitter:image" content="https://crosstimely.com/og-image.png" />
    <script>
      try {
        const savedTheme = localStorage.getItem('app-theme')
        const theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
      } catch {
        document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
